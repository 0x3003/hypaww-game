<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hypaww Graveyard Bull Run</title>
<style>
:root{color-scheme:dark;--bg:#0f0a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Trebuchet MS","Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;user-select:none}
canvas{height:100%;max-width:100%;aspect-ratio:9/16;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=360,H=640,GY=H-52,dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
var OUT='#14101f',CREAM='#f6e7a6',ORG='#ff8a1f',FONT='"Trebuchet MS",sans-serif';
var best=0;try{best=+localStorage.getItem('hypawwBest2')||0}catch(e){}
var state='ready',dog,pipes,score,t=0,over=0,pops=[],bats=[];
for(var i=0;i<4;i++)bats.push({x:Math.random()*W,y:50+Math.random()*180,s:.5+Math.random()*.5});
function reset(){dog={x:96,y:H/2,v:0,r:0};pipes=[];score=0;t=0;pops=[]}
reset();
function flap(){
 if(state==='ready')state='play';
 if(state==='play')dog.v=-7;
 else if(state==='over'&&over>25){state='ready';reset()}
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();flap()});
window.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
function die(){state='over';over=0;dog.v=-4;if(score>best){best=score;try{localStorage.setItem('hypawwBest2',best)}catch(e){}}}

function update(){
 t++;
 bats.forEach(function(b){b.x-=b.s;if(b.x<-30)b.x=W+30});
 for(var i=pops.length-1;i>=0;i--){pops[i].y-=1;pops[i].life--;if(pops[i].life<=0)pops.splice(i,1)}
 if(state==='ready'){dog.y=H/2+60+Math.sin(t/12)*8;dog.r=0;return}
 if(state==='over'){over++;dog.v+=.55;dog.y=Math.min(dog.y+dog.v,GY-20);dog.r=Math.min(dog.r+.08,1.2);return}
 dog.v+=.38;dog.y+=dog.v;dog.r=Math.max(-.35,Math.min(.8,dog.v/11));
 if(t%92===1){var gap=172,top=80+Math.random()*(GY-gap-160);pipes.push({x:W+20,top:top,gap:gap,col:Math.random()<.5?'#3ddc84':'#ff4d5e',coin:true,done:false,cy:top+gap/2+(Math.random()-.5)*50})}
 pipes.forEach(function(p){
  p.x-=2.6;
  if(!p.done&&p.x+46<dog.x){p.done=true;score++}
  var cy=dog.y+8;
  if(dog.x+16>p.x&&dog.x-16<p.x+46&&(cy-14<p.top||cy+14>p.top+p.gap))die();
  if(p.coin){var dx=p.x+23-dog.x,dy=p.cy-cy;if(dx*dx+dy*dy<900){p.coin=false;score+=1;pops.push({x:p.x+23,y:p.cy,life:40})}}
 });
 pipes=pipes.filter(function(p){return p.x>-60});
 if(dog.y>GY-20||dog.y<-10)die();
}

function pumpkin(x,y,r){
 ctx.fillStyle=ORG;ctx.beginPath();ctx.ellipse(x,y,r,r*.85,0,0,7);ctx.fill();
 ctx.fillStyle='#2a1200';
 ctx.beginPath();ctx.moveTo(x-r*.5,y-r*.05);ctx.lineTo(x-r*.15,y-r*.05);ctx.lineTo(x-r*.33,y-r*.4);ctx.fill();
 ctx.beginPath();ctx.moveTo(x+r*.5,y-r*.05);ctx.lineTo(x+r*.15,y-r*.05);ctx.lineTo(x+r*.33,y-r*.4);ctx.fill();
 ctx.fillRect(x-r*.5,y+r*.25,r,r*.17);
}
function bone(x,y,a){
 ctx.save();ctx.translate(x,y);ctx.rotate(a);
 ctx.fillStyle='#fff7dd';ctx.strokeStyle=OUT;ctx.lineWidth=2;
 ctx.fillRect(-9,-3,18,6);
 [[-10,-4],[-10,4],[10,-4],[10,4]].forEach(function(c){ctx.beginPath();ctx.arc(c[0],c[1],4,0,7);ctx.fill()});
 ctx.restore();
}

function ell(x,y,rx,ry,fill,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,7);ctx.fillStyle=fill;ctx.fill();ctx.stroke()}

function drawDog(){
 ctx.save();ctx.translate(dog.x,dog.y);ctx.rotate(dog.r);ctx.scale(.8,.8);
 ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=OUT;ctx.lineWidth=3.5;
 // broom
 ctx.fillStyle='#8a5a2b';ctx.beginPath();ctx.rect(-48,58,100,9);ctx.fill();ctx.stroke();
 var f=Math.sin(t/3)*3;
 ctx.fillStyle='#e2a93b';ctx.beginPath();ctx.moveTo(-46,56);ctx.lineTo(-96,44+f);ctx.lineTo(-104,63);ctx.lineTo(-96,82-f);ctx.lineTo(-46,69);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-50,62);ctx.lineTo(-98,56);ctx.moveTo(-50,64);ctx.lineTo(-98,70);ctx.stroke();ctx.lineWidth=3.5;
 // tail
 ctx.save();ctx.translate(-32,40);ctx.rotate(.95+Math.sin(t/3)*.18);
 ell(-24,0,30,15,'#8d93ab');ell(-48,0,11,10,'#e8eaf5');
 ctx.restore();
 // cape + chest
 ctx.fillStyle='#4b2a78';ctx.beginPath();ctx.moveTo(-32,24);ctx.lineTo(32,24);ctx.lineTo(46,62);ctx.lineTo(-46,62);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle=ORG;ctx.beginPath();ctx.moveTo(-32,24);ctx.lineTo(-12,24);ctx.lineTo(-22,62);ctx.lineTo(-46,62);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(32,24);ctx.lineTo(12,24);ctx.lineTo(22,62);ctx.lineTo(46,62);ctx.closePath();ctx.fill();
 ell(0,44,13,17,'#e8eaf5');
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(18,28,5,0,7);ctx.fill();ctx.stroke();
 // paws
 ell(-27,56,9,6.5,'#e8eaf5');ell(27,56,9,6.5,'#e8eaf5');
 // ears
 ctx.save();ctx.translate(-27,-4);ctx.rotate(.28);ell(0,14,13,26,'#1d1a2c');ctx.restore();
 ctx.save();ctx.translate(27,-4);ctx.rotate(-.28);ell(0,14,13,26,'#1d1a2c');ctx.restore();
 // head
 ell(0,3,33,27,'#b9bdd6');
 ctx.fillStyle='#e8eaf5';ctx.beginPath();ctx.ellipse(0,14,20,12,0,0,7);ctx.fill();
 ctx.fillStyle='rgba(255,100,110,.75)';ctx.beginPath();ctx.arc(-23,13,5.5,0,7);ctx.arc(23,13,5.5,0,7);ctx.fill();
 // eyes
 ell(-13,1,8.5,10,'#ffa21f');ell(13,1,8.5,10,'#ffa21f');
 ctx.fillStyle='#8a2f00';ctx.beginPath();ctx.ellipse(-12,3,4.2,6,0,0,7);ctx.ellipse(14,3,4.2,6,0,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-15,-3,2.8,0,7);ctx.arc(11,-3,2.8,0,7);ctx.fill();
 ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(-24,-10);ctx.lineTo(-5,-5);ctx.moveTo(24,-10);ctx.lineTo(5,-5);ctx.stroke();
 // nose + mouth
 ctx.fillStyle=OUT;ctx.beginPath();ctx.ellipse(0,10,4.5,3.3,0,0,7);ctx.fill();
 ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-10,16);ctx.quadraticCurveTo(-5,22,0,16);ctx.quadraticCurveTo(5,22,10,16);ctx.stroke();
 ctx.fillStyle='#fff';ctx.lineWidth=1.8;
 ctx.beginPath();ctx.moveTo(-7.5,18.5);ctx.lineTo(-3.5,19);ctx.lineTo(-5.5,25);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(7.5,18.5);ctx.lineTo(3.5,19);ctx.lineTo(5.5,25);ctx.closePath();ctx.fill();ctx.stroke();
 // hat
 ctx.lineWidth=3.5;
 ctx.save();ctx.rotate(-.07);
 ell(0,-17,44,10,'#1d1a2c');
 ctx.fillStyle='#1d1a2c';ctx.beginPath();ctx.moveTo(-25,-20);ctx.quadraticCurveTo(-16,-48,-8,-62);ctx.quadraticCurveTo(-5,-74,22,-70);ctx.quadraticCurveTo(8,-62,10,-50);ctx.quadraticCurveTo(14,-36,25,-20);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle=ORG;ctx.beginPath();ctx.moveTo(-25,-20);ctx.lineTo(25,-20);ctx.lineTo(22,-31);ctx.lineTo(-22,-31);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.rect(6,-32,11,12);ctx.fill();ctx.stroke();
 ctx.fillStyle='#e8eaf5';ctx.fillRect(9,-29,5,6);
 ctx.lineWidth=2;pumpkin(-12,-25,6);
 ctx.restore();
 // talisman
 ctx.lineWidth=2.5;ctx.fillStyle='#f28a2a';ctx.beginPath();ctx.rect(-6,-17,12,13);ctx.fill();ctx.stroke();
 ctx.lineWidth=1;pumpkin(0,-10,3.5);
 ctx.restore();
}

function candle(p){
 ctx.fillStyle=p.col;ctx.strokeStyle=OUT;ctx.lineWidth=3;
 [[-5,p.top,true],[p.top+p.gap,GY+5,false]].forEach(function(s){
  var y0=s[0],y1=s[1];
  ctx.beginPath();ctx.rect(p.x,y0,46,y1-y0);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(p.x+7,Math.max(y0,0)+4,6,y1-Math.max(y0,0)-8);
  ctx.fillStyle=p.col;
  ctx.beginPath();ctx.moveTo(p.x+23,s[2]?y1:y0);ctx.lineTo(p.x+23,s[2]?y1+18:y0-18);ctx.strokeStyle=p.col;ctx.lineWidth=4;ctx.stroke();
  ctx.strokeStyle=OUT;ctx.lineWidth=3;
 });
}

function draw(){
 var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1e0f3b');g.addColorStop(.75,'#4a2d7a');g.addColorStop(1,'#2d4a7a');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle=CREAM;ctx.beginPath();ctx.arc(268,88,48,0,7);ctx.fill();
 ctx.fillStyle='rgba(180,150,80,.25)';ctx.beginPath();ctx.arc(254,74,10,0,7);ctx.arc(282,104,7,0,7);ctx.fill();
 // chart grid + trend line
 ctx.strokeStyle='rgba(246,231,166,.08)';ctx.lineWidth=1;
 for(var y=60;y<GY;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(var x=(-t*.8)%60;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GY);ctx.stroke()}
 ctx.strokeStyle='rgba(255,138,31,.35)';ctx.lineWidth=3;ctx.beginPath();
 for(var x=0;x<=W;x+=6){var o=t*.015,yy=400-x*.18+Math.sin(x*.03+o)*34+Math.sin(x*.07+o*2)*14;if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}
 ctx.stroke();
 ctx.fillStyle=OUT;
 bats.forEach(function(b){var f=Math.sin(t/5+b.x)*5,w=14*b.s*2;ctx.beginPath();ctx.moveTo(b.x-w,b.y-f);ctx.quadraticCurveTo(b.x-4,b.y-8,b.x,b.y);ctx.quadraticCurveTo(b.x+4,b.y-8,b.x+w,b.y-f);ctx.quadraticCurveTo(b.x,b.y+10*b.s,b.x-w,b.y-f);ctx.fill()});
 pipes.forEach(function(p){candle(p);if(p.coin)bone(p.x+23,p.cy+Math.sin(t/8)*4,Math.sin(t/14)*.5)});
 // ground ticker
 ctx.fillStyle=OUT;ctx.fillRect(0,GY,W,H-GY);
 ctx.fillStyle=ORG;ctx.fillRect(0,GY,W,3);
 ctx.font='bold 15px '+FONT;ctx.textAlign='left';
 var tape='HYPAWW \u25B2 9.9%    BONE \u25B2 4.2%    PUMPKIN \u25BC 1.3%    PACK \u25B2 22%    ';
 var tw=ctx.measureText(tape).width,off=(t*2)%tw;
 ctx.fillStyle='#3ddc84';
 for(var k=-1;k<3;k++)ctx.fillText(tape,k*tw-off,GY+32);
 drawDog();
 pops.forEach(function(p){ctx.globalAlpha=p.life/40;ctx.fillStyle='#fff7dd';ctx.font='bold 20px '+FONT;ctx.textAlign='center';ctx.fillText('+1 bone',p.x,p.y);ctx.globalAlpha=1});
 ctx.textAlign='center';
 if(state!=='ready'){ctx.fillStyle=CREAM;ctx.strokeStyle=OUT;ctx.lineWidth=5;ctx.font='bold 46px '+FONT;ctx.strokeText(score,W/2,72);ctx.fillText(score,W/2,72)}
 if(state==='ready'){
  ctx.fillStyle='rgba(15,10,26,.7)';ctx.fillRect(30,150,300,130);
  ctx.fillStyle=ORG;ctx.font='bold 34px '+FONT;ctx.fillText('HYPAWW',W/2,196);
  ctx.fillStyle=CREAM;ctx.font='bold 24px '+FONT;ctx.fillText('Graveyard Bull Run',W/2,230);
  ctx.font='15px '+FONT;ctx.fillText('The canine brokerage never sleeps',W/2,260);
  ctx.font='18px '+FONT;ctx.fillText('Tap or press Space to fly',W/2,H-140);
  ctx.fillText('Dodge the candles, grab the bones',W/2,H-114);
  ctx.fillText('Best: '+best,W/2,H-84);
 }
 if(state==='over'){
  ctx.fillStyle='rgba(15,10,26,.85)';ctx.fillRect(30,190,300,220);
  ctx.fillStyle='#ff4d5e';ctx.font='bold 32px '+FONT;ctx.fillText('Market crashed!',W/2,242);
  ctx.fillStyle=CREAM;ctx.font='22px '+FONT;
  ctx.fillText('Score '+score+'   Best '+best,W/2,288);
  ctx.fillStyle='#3ddc84';ctx.fillText('Tap to buy the dip',W/2,336);
  ctx.fillStyle=ORG;ctx.font='15px '+FONT;ctx.fillText('#HypawwChallenge  @Hypaww',W/2,380);
 }
}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
})();
</script>
</body>
</html>
